name: checks
on:
  push:
  pull_request:
  # Monthly too, so an expiring security.txt fails CI before scanners notice.
  schedule:
    - cron: '41 7 1 * *'

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate JSON files
        run: |
          set -e
          find . -name '*.json' -not -path '*/node_modules/*' -not -path './.git/*' | while read -r f; do
            python3 -m json.tool "$f" > /dev/null || { echo "Invalid JSON: $f"; exit 1; }
          done

      - name: Forbid weak HTML escapers (must also escape quotes)
        run: |
          if grep -rnE --include='*.html' --include='*.js' --exclude-dir=node_modules --exclude-dir=.git "replace\(/>/g, ?'&gt;'\) *[;)]" .; then
            echo "Found a 3-char HTML escaper - use the canonical 5-char version that also escapes quotes"
            exit 1
          fi

      - name: Security headers file present
        run: test -f _headers

      - name: Internal links resolve
        run: |
          python3 - <<'PY'
          import re, os, sys

          paths_seen = set()
          for root, dirs, files in os.walk('.'):
              dirs[:] = [d for d in dirs if d not in ('.git', 'node_modules')]
              for f in files:
                  if not f.endswith('.html'):
                      continue
                  p = os.path.join(root, f)
                  html = open(p, encoding='utf-8').read()
                  for m in re.finditer(r'''href=["'](/[^"'#]*)''', html):
                      paths_seen.add((p, m.group(1)))
                  for m in re.finditer(r'''href=["']https://lucafchala\.com(/[^"'#]*)''', html):
                      paths_seen.add((p, m.group(1)))

          redirect_sources = set()
          with open('_redirects', encoding='utf-8') as f:
              for line in f:
                  line = line.strip()
                  if not line or line.startswith('#'):
                      continue
                  parts = line.split()
                  if parts:
                      redirect_sources.add(parts[0])

          bad = []
          for src_file, link in sorted(paths_seen):
              path = link.split('?')[0]
              if path == '/' or path in redirect_sources:
                  continue
              rel = path.lstrip('/')
              candidates = [c for c in (rel, rel.rstrip('/') + '/index.html') if c]
              if not any(os.path.isfile(c) for c in candidates):
                  bad.append((src_file, link))

          if bad:
              print("Broken internal links found:")
              for src_file, link in bad:
                  print(f"  {src_file}: {link}")
              sys.exit(1)
          print(f"Checked {len(paths_seen)} internal links, all resolve.")
          PY

      - name: CSP hashes cover every inline script
        run: |
          python3 - <<'PY'
          import re, os, sys, hashlib, base64

          def h(x):
              return "'sha256-" + base64.b64encode(hashlib.sha256(x.encode()).digest()).decode() + "'"

          headers = open('_headers', encoding='utf-8').read()
          m = re.search(r"script-src ([^;]*)", headers)
          allowed = set(m.group(1).split()) if m else set()

          missing = []
          for root, dirs, files in os.walk('.'):
              dirs[:] = [d for d in dirs if d not in ('.git', 'node_modules')]
              for f in files:
                  if not f.endswith('.html'):
                      continue
                  p = os.path.join(root, f)
                  html = open(p, encoding='utf-8').read()
                  for s in re.finditer(r'<script\b([^>]*)>(.*?)</script>', html, re.DOTALL):
                      attrs, inner = s.group(1), s.group(2)
                      if 'src=' in attrs or not inner.strip() or 'application/ld+json' in attrs:
                          continue
                      if h(inner) not in allowed:
                          missing.append(f"{p}: inline <script{attrs}> -> {h(inner)}")
                  for m in re.finditer(r'''\son[a-z]+=(?:"([^"]*)"|'([^']*)')''', html):
                      handler = m.group(1) if m.group(1) is not None else m.group(2)
                      if h(handler) not in allowed or "'unsafe-hashes'" not in allowed:
                          missing.append(f"{p}: inline handler {handler!r} -> {h(handler)} (needs 'unsafe-hashes')")

          if missing:
              print("These inline scripts would be blocked by the CSP in _headers:")
              print("\n".join("  " + x for x in missing))
              print("Regenerate the hashes (see CLAUDE.md).")
              sys.exit(1)
          print("All inline scripts are covered by the CSP.")
          PY

      # Rocket Loader is off today, but a re-enable would defer theme.js and
      # break theme-before-paint on every page that forgot the opt-out.
      - name: Every script tag opts out of Rocket Loader
        run: |
          python3 - <<'PY'
          import re, os, sys
          bad = []
          for root, dirs, files in os.walk('.'):
              dirs[:] = [d for d in dirs if d not in ('.git', 'node_modules')]
              for f in files:
                  if f.endswith('.html'):
                      p = os.path.join(root, f)
                      for tag in re.findall(r'<script\b[^>]*>', open(p, encoding='utf-8').read()):
                          if 'application/ld+json' not in tag and 'data-cfasync="false"' not in tag:
                              bad.append(f"{p}: {tag}")
          if bad:
              print('Add data-cfasync="false" to:'); print("\n".join("  " + b for b in bad)); sys.exit(1)
          print("Every <script> has data-cfasync=\"false\".")
          PY

      # RFC 9116: Expires is required, and should be less than a year out. The
      # monthly run turns "renew before it lapses" into a red CI run.
      - name: security.txt Expires between 30 days and 1 year from now
        run: |
          exp=$(sed -n 's/^Expires: *//p' .well-known/security.txt)
          [ -n "$exp" ] || { echo "security.txt has no Expires"; exit 1; }
          left=$(( ( $(date -d "$exp" +%s) - $(date +%s) ) / 86400 ))
          echo "Expires $exp ($left days left)"
          [ "$left" -ge 30 ] || { echo "Renew .well-known/security.txt here, in proof.lucafchala.com and in status.lucafchala.com (same Expires): set Expires to ~11 months ahead"; exit 1; }
          [ "$left" -le 366 ] || { echo "Expires is more than a year out (RFC 9116 recommends less)"; exit 1; }

      # Web Analytics is a manual snippet (lucafchala.com#18). The token is
      # public but must be the real one: the placeholder never reaches main.
      - name: Web Analytics snippet has a real token
        run: |
          n=$(grep -c 'static.cloudflareinsights.com/beacon.min.js' index.html || true)
          [ "$n" = "1" ] || { echo "index.html must load the Web Analytics beacon exactly once (found $n)"; exit 1; }
          grep -q '__CF_BEACON_TOKEN__' index.html && { echo "Fill in the Web Analytics token (Cloudflare → Web Analytics → lucafchala.com → Manage site) in place of __CF_BEACON_TOKEN__"; exit 1; } || true
          grep -Eq "data-cf-beacon='\{\"token\": \"[0-9a-f]{32}\"\}'" index.html || { echo "data-cf-beacon token must be 32 hex characters"; exit 1; }
          echo "Web Analytics snippet OK"
