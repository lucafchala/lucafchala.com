name: checks
on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate JSON files
        run: |
          set -e
          find . -name '*.json' -not -path '*/node_modules/*' -not -path './.git/*' | while read -r f; do
            python3 -m json.tool "$f" > /dev/null || { echo "Invalid JSON: $f"; exit 1; }
          done

      - name: Forbid weak HTML escapers (must also escape quotes)
        run: |
          if grep -rnE --include='*.html' --include='*.js' --exclude-dir=node_modules --exclude-dir=.git "replace\(/>/g, ?'&gt;'\) *[;)]" .; then
            echo "Found a 3-char HTML escaper - use the canonical 5-char version that also escapes quotes"
            exit 1
          fi

      - name: Security headers file present
        run: test -f _headers

      - name: Internal links resolve
        run: |
          python3 - <<'PY'
          import re, os, sys

          paths_seen = set()
          for root, dirs, files in os.walk('.'):
              dirs[:] = [d for d in dirs if d not in ('.git', 'node_modules')]
              for f in files:
                  if not f.endswith('.html'):
                      continue
                  p = os.path.join(root, f)
                  html = open(p, encoding='utf-8').read()
                  for m in re.finditer(r'''href=["'](/[^"'#]*)''', html):
                      paths_seen.add((p, m.group(1)))
                  for m in re.finditer(r'''href=["']https://lucafchala\.com(/[^"'#]*)''', html):
                      paths_seen.add((p, m.group(1)))

          redirect_sources = set()
          with open('_redirects', encoding='utf-8') as f:
              for line in f:
                  line = line.strip()
                  if not line or line.startswith('#'):
                      continue
                  parts = line.split()
                  if parts:
                      redirect_sources.add(parts[0])

          bad = []
          for src_file, link in sorted(paths_seen):
              path = link.split('?')[0]
              if path == '/' or path in redirect_sources:
                  continue
              rel = path.lstrip('/')
              candidates = [c for c in (rel, rel.rstrip('/') + '/index.html') if c]
              if not any(os.path.isfile(c) for c in candidates):
                  bad.append((src_file, link))

          if bad:
              print("Broken internal links found:")
              for src_file, link in bad:
                  print(f"  {src_file}: {link}")
              sys.exit(1)
          print(f"Checked {len(paths_seen)} internal links, all resolve.")
          PY
