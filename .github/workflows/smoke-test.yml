name: smoke-test
on:
  deployment_status

jobs:
  smoke-test:
    if: github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Hit key routes on the deployed site
        env:
          BASE_URL: ${{ github.event.deployment_status.environment_url || 'https://lucafchala.com' }}
        run: |
          set -e
          paths="/ /status/ /sitemap.xml /robots.txt /llms.txt /manifest.json /.well-known/security.txt /.well-known/gpc.json"
          fail=0
          for path in $paths; do
            url="${BASE_URL%/}${path}"
            code=$(curl -s -o /dev/null -w '%{http_code}' -L "$url")
            if [ "$code" != "200" ]; then
              echo "FAIL: $url returned $code"
              fail=1
            else
              echo "OK: $url"
            fi
          done
          exit $fail
